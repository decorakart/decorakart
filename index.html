<!DOCTYPE html>
<html>
<head>
  <title>Decorakart Store</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: Arial; margin:0; background:#f6f6f6; }
    header { background:#fff; padding:15px; border-bottom:1px solid #ddd; }
    header b { font-size:18px; letter-spacing:2px; }
    .wrap { max-width:1100px; margin:auto; padding:20px; }
    .products { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; }
    .card { background:#fff; padding:12px; border-radius:10px; border:1px solid #eee; }
    .img { height:140px; background:#ddd; border-radius:8px; margin-bottom:8px; text-align:center; line-height:140px; }
    .price { font-weight:bold; }
    .old { text-decoration:line-through; font-size:13px; color:gray; }
    button { background:black; color:white; border:none; padding:8px 12px; border-radius:20px; cursor:pointer; }
    .cart { margin-top:40px; padding:20px; background:#fff; border-radius:10px; }
  </style>
</head>
<body>

<header>
  <div class="wrap">
    <b>DECORAKART</b>
  </div>
</header>

<div class="wrap">
  <h2>Shop</h2>
  <div class="products" id="products"></div>

  <div class="cart">
    <h3>Cart</h3>
    <ul id="cart"></ul>
    <b id="total">Total: ₹0</b><br><br>
    <button onclick="checkout()">Checkout on WhatsApp</button>
  </div>
</div>

<script>
let cart = {};
const phone = "918807403946";

fetch("products.json")
.then(r => r.json())
.then(data => {
  const productsDiv = document.getElementById("products");
  data.forEach(p => {
    if(!p.active || p.stock === "out-of-stock") return;

    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <div class="img">${p.name.split(" ")[0]}</div>
      <b>${p.name}</b><br>
      <span class="old">₹${p.price}</span> 
      <span class="price">₹${p.salePrice}</span><br>
      <button onclick="add('${p.id}',${p.salePrice},'${p.name}')">Add to Cart</button>
    `;
    productsDiv.appendChild(div);
  });
});

function add(id, price, name) {
  if(!cart[id]) cart[id] = {name, price, qty:1};
  else cart[id].qty++;
  updateCart();
}

function updateCart() {
  let ul = document.getElementById("cart");
  let total = 0;
  ul.innerHTML = "";
  for(let k in cart) {
    let li = document.createElement("li");
    li.textContent = cart[k].name + " x " + cart[k].qty + " = ₹" + (cart[k].qty * cart[k].price);
    total += cart[k].qty * cart[k].price;
    ul.appendChild(li);
  }
  document.getElementById("total").innerText = "Total: ₹" + total;
}

function checkout() {
  if(Object.keys(cart).length === 0){
    alert("Cart khali hai, pehle kuch add karo.");
    return;
  }
  let msg = "Hi Decorakart, I want to order:\n";
  let total = 0;
  for(let k in cart) {
    msg += cart[k].name + " x " + cart[k].qty + "\n";
    total += cart[k].qty * cart[k].price;
  }
  msg += "\nTotal: ₹" + total + "\nName:\nAddress:\nPincode:";
  window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(msg));
}
</script>

</body>
</html>
