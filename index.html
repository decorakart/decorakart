<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Decorakart – Premium Ceramic Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f6f2;
      color: #222;
    }
    header {
      background: #fff;
      padding: 16px 24px;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 999;
    }
    .nav {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-weight: 700;
      letter-spacing: 3px;
      font-size: 18px;
    }
    .nav button {
      background: black;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 30px;
      cursor: pointer;
    }

    .hero {
      max-width: 1200px;
      padding: 40px 24px;
      margin: auto;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 30px;
      align-items: center;
    }
    .hero h1 {
      font-size: 38px;
      margin-bottom: 12px;
    }
    .hero p {
      color: #555;
      font-size: 16px;
      max-width: 500px;
      margin-bottom: 20px;
    }

    .category-bar {
      max-width: 1200px;
      margin: auto;
      padding: 0 24px 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .category-bar button {
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid #ccc;
      background: white;
      cursor: pointer;
      font-size: 14px;
    }
    .category-bar button.active {
      background: black;
      color: white;
    }

    .shop {
      max-width: 1200px;
      margin: auto;
      padding: 0 24px 60px;
      display: grid;
      grid-template-columns: 2.5fr 1fr;
      gap: 24px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      border-radius: 14px;
      border: 1px solid #eee;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
      cursor: pointer;
    }
    .card .name {
      font-weight: 600;
      font-size: 15px;
    }
    .price-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .old {
      text-decoration: line-through;
      font-size: 13px;
      color: #888;
    }
    .price {
      font-weight: bold;
      font-size: 16px;
    }

    .card button {
      margin-top: 6px;
      padding: 9px;
      background: black;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }

    .cart {
      background: white;
      border: 1px solid #eee;
      border-radius: 14px;
      padding: 14px;
      font-size: 14px;
      position: sticky;
      top: 90px;
    }
    .cart h3 {
      margin-bottom: 10px;
    }
    .cart ul {
      list-style: none;
      padding: 0;
      margin: 0 0 10px;
      max-height: 220px;
      overflow-y: auto;
    }
    .cart li {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .cart .total {
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    @media(max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
      }
      .shop {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="nav">
    <div class="logo">DECORAKART</div>
    <button onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">Shop Now</button>
  </div>
</header>

<section class="hero">
  <div>
    <h1>Premium ceramic mugs, decor & kitchenware</h1>
    <p>Handpicked ceramic products shipped directly from Khurja. Clean premium pieces for modern Indian homes.</p>
    <button onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">Browse Collection</button>
  </div>
  <img src="mug1.jpg" style="width:100%;border-radius:16px;">
</section>

<section id="shop">
  <div class="category-bar">
    <button class="active" onclick="setCategory('all', this)">All</button>
    <button onclick="setCategory('mugs', this)">Mugs</button>
    <button onclick="setCategory('vases', this)">Vases</button>
    <button onclick="setCategory('decor', this)">Decor</button>
    <button onclick="setCategory('kitchen', this)">Kitchen Containers</button>
  </div>

  <div class="shop">
    <div class="products" id="products"></div>

    <div class="cart">
      <h3>Your Cart</h3>
      <ul id="cartItems"></ul>
      <div class="total" id="totalBox" style="display:none;">
        <span>Total</span><span id="totalPrice">₹0</span>
      </div>
      <button onclick="checkout()">Checkout on WhatsApp</button>
    </div>
  </div>
</section>

<script>
  let data = [];
  let activeCategory = "all";
  let cart = {};
  let imageIndex = {};
  const phone = "918807403946";

  fetch("products.json")
    .then(res => res.json())
    .then(d => {
      data = d;
      render();
    });

  function setCategory(cat, btn) {
    activeCategory = cat;
    document.querySelectorAll(".category-bar button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    render();
  }

  function render() {
    const box = document.getElementById("products");
    box.innerHTML = "";

    data.forEach(p => {
      if (!p.active) return;
      if (activeCategory !== "all" && p.category !== activeCategory) return;

      const priceUse = p.salePrice < p.price ? p.salePrice : p.price;

      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <img src="${p.images[0]}" id="img-${p.id}" onclick="nextImage('${p.id}')">
        <div class="name">${p.name}</div>
        <div class="price-row">
          ${p.salePrice < p.price ? `<span class="old">₹${p.price}</span>` : ""}
          <span class="price">₹${priceUse}</span>
        </div>
        <button onclick="add('${p.id}', ${priceUse}, '${p.name.replace(/'/g,"")}')">Add to Cart</button>
      `;
      box.appendChild(div);
    });
  }

  function nextImage(id) {
    const p = data.find(x => x.id === id);
    if (!p || !p.images || p.images.length < 2) return;

    imageIndex[id] = (imageIndex[id] || 0) + 1;
    if (imageIndex[id] >= p.images.length) imageIndex[id] = 0;

    document.getElementById("img-" + id).src = p.images[imageIndex[id]];
  }

  function add(id, price, name) {
    if (!cart[id]) cart[id] = {name, price, qty: 1};
    else cart[id].qty++;

    updateCart();
  }

  function updateCart() {
    const ul = document.getElementById("cartItems");
    ul.innerHTML = "";
    let total = 0;

    for (let k in cart) {
      const line = cart[k].qty * cart[k].price;
      total += line;

      const li = document.createElement("li");
      li.innerHTML = `<span>${cart[k].name} × ${cart[k].qty}</span><span>₹${line}</span>`;
      ul.appendChild(li);
    }

    if (total > 0) {
      document.getElementById("totalBox").style.display = "flex";
      document.getElementById("totalPrice").innerText = "₹" + total;
    }
  }

  function checkout() {
    if (Object.keys(cart).length === 0) {
      alert("Cart empty hai");
      return;
    }

    let msg = "Hi Decorakart, I want to place this order:%0A%0A";
    let total = 0;

    for (let k in cart) {
      msg += `${cart[k].name} × ${cart[k].qty}%0A`;
      total += cart[k].qty * cart[k].price;
    }

    msg += `%0ATotal: ₹${total}%0AName:%0AAddress:%0APincode:`;
    window.open(`https://wa.me/${phone}?text=${msg}`);
  }
</script>

</body>
</html>
